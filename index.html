<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ruteo Copsa — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --page-bg:#050b16;
    --ink:#1c2430;
    --ink-soft:#64748b;
    --card:#ffffff;
    --line:#e6e9ef;
    --brand:#1e5f8c;
    --ok:#1e9e6b;
    --ok-bg:#e6f7ef;
    --warn:#c8562b;
    --warn-bg:#fdece3;
    --pending:#94a3b8;
    --pending-bg:#eef1f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 500px at 15% -10%, #123354 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #0d2438 0%, transparent 55%),
      var(--page-bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:980px;margin:0 auto;background:var(--card);border-radius:16px;
    box-shadow:0 30px 60px -25px rgba(15,23,42,.35), 0 2px 8px rgba(15,23,42,.1);
    padding:24px 28px 30px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .brand-block{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .brand{font-size:19px;font-weight:800;color:var(--brand);letter-spacing:.01em;}
  .datepick{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);}
  .live{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ok);background:var(--ok-bg);padding:6px 12px;border-radius:99px;}
  .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,158,107,.5);}70%{box-shadow:0 0 0 7px rgba(30,158,107,0);}100%{box-shadow:0 0 0 0 rgba(30,158,107,0);}}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  .stat{border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .stat .n{font-size:26px;font-weight:800;line-height:1;}
  .stat .t{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .stat.ok .n{color:var(--ok);}
  .stat.pending .n{color:var(--pending);}
  .stat.warn .n{color:var(--warn);}

  h2{font-size:15px;margin:0 0 14px;}
  .empty{font-size:13px;color:var(--ink-soft);padding:20px 0;text-align:center;}

  .routes{display:flex;flex-direction:column;gap:14px;}
  .route{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .route-head{display:flex;align-items:center;gap:14px;padding:15px 18px;cursor:pointer;}
  .route-head:hover{background:#fafbfc;}
  .route-name{font-size:14.5px;font-weight:700;flex:0 0 130px;}
  .route-meta{font-size:12px;color:var(--ink-soft);flex:0 0 220px;}
  .route-bar-wrap{flex:1;display:flex;align-items:center;gap:10px;}
  .route-bar{flex:1;height:7px;background:var(--pending-bg);border-radius:99px;overflow:hidden;}
  .route-bar-fill{height:100%;background:var(--ok);border-radius:99px;transition:width .4s;}
  .route-count{font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .chev{font-size:15px;color:var(--ink-soft);transition:transform .2s;flex:0 0 auto;}
  .route.open .chev{transform:rotate(90deg);}

  .stops-table{display:none;border-top:1px solid var(--line);}
  .route.open .stops-table{display:block;}
  .srow{padding:11px 18px 11px 46px;font-size:13px;border-bottom:1px solid #f1f3f6;cursor:pointer;}
  .srow:last-child{border-bottom:none;}
  .srow-top{display:flex;align-items:center;gap:12px;}
  .srow .sc-name{flex:1 1 230px;font-weight:600;}
  .srow .sc-addr{flex:1 1 220px;color:var(--ink-soft);font-size:12.5px;}
  .srow .sc-time{flex:0 0 70px;color:var(--ink-soft);font-size:12px;text-align:right;}
  .srow-detail{display:none;margin-top:8px;padding:10px 12px;background:var(--pending-bg);border-radius:10px;font-size:12.5px;color:var(--ink);}
  .srow.open .srow-detail{display:block;}
  .srow-detail b{color:var(--ink-soft);font-weight:600;}

  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;flex:0 0 auto;min-width:84px;text-align:center;}
  .badge.pendiente{background:var(--pending-bg);color:var(--ink-soft);}
  .badge.entregado{background:var(--ok-bg);color:var(--ok);}
  .badge.problema{background:var(--warn-bg);color:var(--warn);}

  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .route-head{flex-wrap:wrap;}
    .route-name,.route-meta{flex:1 1 auto;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand-block">
      <div class="brand">RUTEO COPSA</div>
      <input type="date" id="datePicker" class="datepick">
    </div>
    <div class="live"><span class="pulse"></span> En vivo</div>
  </div>

  <div class="stats">
    <div class="stat total"><div class="n" id="statTotal">—</div><div class="t">Entregas programadas</div></div>
    <div class="stat ok"><div class="n" id="statOk">—</div><div class="t">Entregadas</div></div>
    <div class="stat pending"><div class="n" id="statPending">—</div><div class="t">Pendientes</div></div>
    <div class="stat warn"><div class="n" id="statWarn">—</div><div class="t">Con problema</div></div>
  </div>

  <h2>Rutas del día</h2>
  <div class="routes" id="routes"></div>
  <div class="empty" id="emptyMsg" style="display:none;">No hay rutas cargadas para esta fecha todavía.</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, query, where, orderBy, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const datePicker = document.getElementById('datePicker');
  const routesEl = document.getElementById('routes');
  const emptyMsg = document.getElementById('emptyMsg');

  function hoyLocal(){
    const d = new Date();
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  datePicker.value = hoyLocal();

  const openRoutes = {}; // rutaId -> bool (tarjeta abierta o cerrada)
  const openStops = {};  // paradaId -> bool (detalle de producto/remito abierto)
  let rutasUnsub = null;
  const paradasUnsub = {}; // rutaId -> función de unsubscribe

  // estado en memoria de todo lo que vamos escuchando
  let rutas = {}; // rutaId -> {meta, paradas: {paradaId: data}}

  function labelFor(estado){
    if(estado === 'entregado') return 'Entregado';
    if(estado === 'problema') return 'Con problema';
    return 'Pendiente';
  }

  function render(){
    routesEl.innerHTML = "";
    const rutaIds = Object.keys(rutas).sort((a,b) => {
      return (rutas[a].meta.nroViaje || "").localeCompare(rutas[b].meta.nroViaje || "", undefined, {numeric:true});
    });

    emptyMsg.style.display = rutaIds.length === 0 ? 'block' : 'none';

    let totalOk=0, totalPending=0, totalWarn=0, total=0;

    rutaIds.forEach(rutaId => {
      const info = rutas[rutaId];
      const paradas = Object.values(info.paradas || {}).sort((a,b) => (a.orden ?? 0) - (b.orden ?? 0));
      const done = paradas.filter(p => p.estado === 'entregado').length;
      const warn = paradas.filter(p => p.estado === 'problema').length;
      total += paradas.length; totalOk += done; totalWarn += warn;
      totalPending += paradas.length - done - warn;

      const el = document.createElement('div');
      el.className = 'route' + (openRoutes[rutaId] ? ' open' : '');

      const head = document.createElement('div');
      head.className = 'route-head';
      head.innerHTML =
        '<div class="route-name">Viaje ' + (info.meta.nroViaje || '?') + '</div>' +
        '<div class="route-meta">' + (info.meta.vehiculo || '—') + ' · ' + (info.meta.chofer || 'Sin asignar') + '</div>' +
        '<div class="route-bar-wrap">' +
          '<div class="route-bar"><div class="route-bar-fill" style="width:' + (paradas.length ? (100*done/paradas.length) : 0) + '%"></div></div>' +
          '<div class="route-count">' + done + '/' + paradas.length + '</div>' +
        '</div>' +
        '<div class="chev">›</div>';
      head.addEventListener('click', () => { openRoutes[rutaId] = !openRoutes[rutaId]; render(); });
      el.appendChild(head);

      const table = document.createElement('div');
      table.className = 'stops-table';
      paradas.forEach(p => {
        const row = document.createElement('div');
        row.className = 'srow' + (openStops[p._id] ? ' open' : '');
        row.innerHTML =
          '<div class="srow-top">' +
            '<div class="sc-name">' + p.cliente + '</div>' +
            '<div class="sc-addr">' + p.direccion + '</div>' +
            '<div class="sc-time">' + (p.horaTexto || '') + '</div>' +
            '<div class="badge ' + p.estado + '">' + labelFor(p.estado) + '</div>' +
          '</div>' +
          '<div class="srow-detail"><b>Producto:</b> ' + (p.producto || '—') + '<br><b>Remito:</b> ' + (p.remito || '—') + '</div>';
        row.addEventListener('click', () => { openStops[p._id] = !openStops[p._id]; render(); });
        table.appendChild(row);
      });
      el.appendChild(table);

      routesEl.appendChild(el);
    });

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statOk').textContent = totalOk;
    document.getElementById('statPending').textContent = totalPending;
    document.getElementById('statWarn').textContent = totalWarn;
  }

  function suscribirParadas(rutaId){
    if(paradasUnsub[rutaId]) paradasUnsub[rutaId]();
    const paradasRef = collection(db, 'rutas', rutaId, 'paradas');
    paradasUnsub[rutaId] = onSnapshot(paradasRef, snap => {
      const paradas = {};
      snap.forEach(d => {
        const data = d.data();
        data._id = rutaId + '_' + d.id;
        data.horaTexto = data.horaActualizacion && data.horaActualizacion.toDate
          ? data.horaActualizacion.toDate().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})
          : '';
        paradas[d.id] = data;
      });
      if(rutas[rutaId]) rutas[rutaId].paradas = paradas;
      render();
    });
  }

  function suscribirFecha(fecha){
    if(rutasUnsub) rutasUnsub();
    Object.values(paradasUnsub).forEach(fn => fn());
    for(const k in paradasUnsub) delete paradasUnsub[k];
    rutas = {};
    render();

    const q = query(collection(db, 'rutas'), where('fecha', '==', fecha));
    rutasUnsub = onSnapshot(q, snap => {
      const idsActuales = new Set();
      snap.forEach(d => {
        idsActuales.add(d.id);
        if(!rutas[d.id]) rutas[d.id] = { meta: d.data(), paradas: {} };
        else rutas[d.id].meta = d.data();
        if(!paradasUnsub[d.id]) suscribirParadas(d.id);
      });
      // sacar rutas que ya no están para esta fecha
      Object.keys(rutas).forEach(id => {
        if(!idsActuales.has(id)){
          if(paradasUnsub[id]){ paradasUnsub[id](); delete paradasUnsub[id]; }
          delete rutas[id];
        }
      });
      render();
    });
  }

  datePicker.addEventListener('change', () => suscribirFecha(datePicker.value));
  suscribirFecha(datePicker.value);
</script>

</body>
</html>
